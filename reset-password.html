<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passwort zurücksetzen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:"Segoe UI",Arial,system-ui,sans-serif;background:radial-gradient(120% 120% at 50% 0%,#182238,#0b0f1c 60%,#1b1030);color:#fff;padding:20px}
  .card{width:min(440px,96vw);background:#14181f;border:1px solid #2a3444;border-radius:18px;padding:30px 26px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.5)}
  h1{font-size:22px;margin:0 0 6px}
  p{color:#9fb3cc;margin:0 0 18px;font-size:14px;line-height:1.4}
  label{display:block;text-align:left;font-size:13px;font-weight:700;color:#c7d3e2;margin:12px 0 6px}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a3444;background:#0f1724;color:#fff;font-size:16px}
  button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#3f7bd6;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:14px;font-size:14px;font-weight:700;min-height:20px}
  .msg.err{color:#ff8a8a}
  .msg.ok{color:#7bd88f}
  a{color:#8fd0ff}
</style>
</head>
<body>
<div class="card">
  <h1>Passwort zurücksetzen</h1>
  <p id="hint">Bitte vergib ein neues Passwort für dein Konto.</p>
  <div id="form">
    <label for="pw1">Neues Passwort</label>
    <input id="pw1" type="password" autocomplete="new-password" placeholder="mindestens 8 Zeichen">
    <label for="pw2">Passwort wiederholen</label>
    <input id="pw2" type="password" autocomplete="new-password" placeholder="Passwort erneut eingeben">
    <button id="save" disabled>Passwort speichern</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
  const cfg = window.CONFIG || {};
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY,
    { auth:{ detectSessionInUrl:true, flowType:'implicit' } });
  const msg=document.getElementById('msg'), save=document.getElementById('save');
  const hint=document.getElementById('hint');
  let ready=false;
  function setMsg(t,cls){ msg.textContent=t; msg.className='msg '+(cls||''); }

  // Supabase liest den Recovery-Token aus dem URL-Hash und löst PASSWORD_RECOVERY aus
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY' || session){ ready=true; save.disabled=false; }
  });
  // Fallback: falls das Event schon durch ist, Session prüfen
  (async()=>{
    try{ const { data } = await sb.auth.getSession();
      if(data && data.session){ ready=true; save.disabled=false; }
      else if(!/access_token|type=recovery/.test(location.hash)){
        setMsg('Kein gültiger Reset-Link. Bitte fordere den Link erneut an.','err');
        hint.textContent='Dieser Link ist ungültig oder abgelaufen.';
      }
    }catch(e){}
  })();

  save.addEventListener('click', async ()=>{
    const p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
    if(p1.length<8){ setMsg('Das Passwort muss mindestens 8 Zeichen haben.','err'); return; }
    if(p1!==p2){ setMsg('Die Passwörter stimmen nicht überein.','err'); return; }
    if(!ready){ setMsg('Der Reset-Link wird noch geprüft – bitte einen Moment warten.','err'); return; }
    save.disabled=true; setMsg('Speichere …');
    try{
      const { error } = await sb.auth.updateUser({ password:p1 });
      if(error){ setMsg('Fehler: '+error.message,'err'); save.disabled=false; return; }
      setMsg('Passwort geändert. Du wirst weitergeleitet …','ok');
      setTimeout(()=>{ location.href='index.html'; }, 1800);
    }catch(e){ setMsg('Fehler: '+e.message,'err'); save.disabled=false; }
  });
</script>
</body>
</html>
