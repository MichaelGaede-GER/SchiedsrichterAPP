<!DOCTYPE html>
<html lang="de">
<head>
<script src="i18n.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Squash – Stream</title>
<style>
  :root{ --green:#82F84E; --blue:#1a4bff; --red:#e5343b; --dark:#1b1b1b; --yellow:#ffd23f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Arial,system-ui,sans-serif;
    background:var(--green);overflow:hidden;color:#111}
  #stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}

  /* Steuerleiste (im Stream weg-croppen oder mit H ausblenden) */
  .idle{opacity:.25;font-weight:800;font-size:5vw;color:#0a3d0a}
  .mo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;
    background:transparent;color:#fff;text-align:center;padding:3vh 4vw}
  .mo-frame{background:rgba(10,14,22,.97);border:1px solid rgba(255,255,255,.12);border-radius:24px;
    padding:26px 34px;width:min(90vw,1000px);max-height:94vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 20px 80px rgba(0,0,0,.55)}
  .mo-logo{height:56px;object-fit:contain;margin-bottom:2px}
  .mo-players{font-size:34px;font-weight:900;color:#fff;line-height:1.15;text-align:center}
  .mo-vs2{color:#9fb3cc;font-size:.62em;font-weight:700}
  .mo-heading{font-size:30px;font-weight:900;color:#fff;line-height:1.1;margin-top:4px;text-align:center}
  .mo-score{font-size:30px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:12px;justify-content:center;flex-wrap:wrap}
  .mo-sets{font-size:20px;color:#9fc0ff;font-weight:800}
  .mo-next{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:2px}
  .mo-card{display:flex;align-items:stretch;gap:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 16px;text-align:left}
  .mo-card.first{border-color:#3f7bd6;box-shadow:inset 0 0 0 1px rgba(63,123,214,.5)}
  .mo-when{flex:0 0 auto;min-width:96px;display:flex;flex-direction:column;justify-content:center}
  .mo-time{font-size:22px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
  .mo-lbl{font-size:11px;font-weight:800;color:#9fb3cc;letter-spacing:.12em;text-transform:uppercase}
  .mo-cbody{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
  .mo-crow{font-size:22px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mo-fl{border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  .mo-vs{color:#9fb3cc;font-weight:700;font-size:.8em}
  .mo-cmeta{font-size:14px;font-weight:800;color:#8fd0ff}
  .mo-cref{font-size:13px;color:#9fb3cc}
  .mo-cref b{color:#c7d3e2}
  /* Timer-Banner (Aufwärmen / Satzpause / Timeout) */
  .stimer{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:40;display:none;
    align-items:center;gap:16px;background:#111;color:#fff;border-radius:16px;padding:12px 26px;
    box-shadow:0 4px 16px rgba(0,0,0,.45)}
  .stimer .lbl{font-size:24px;font-weight:800;letter-spacing:.5px}
  .stimer .clk{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;color:#ffd23f}

  /* ===== gemeinsame Bausteine ===== */
  .flagimg{display:inline-block;background-size:cover;background-position:center;border-radius:3px;flex:0 0 auto}
  .dot{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:#111;margin-left:.35em;vertical-align:middle}

  /* ===== PSA LINE ===== */
  .psaline{display:flex;align-items:stretch;gap:14px;width:min(1760px,96vw)}
  /* PSA-Broadcast-Leiste (nach Vorlage: weiße Pille + Satzboxen darunter) */
  .psawrap{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;max-width:96vw}
  .psaball{white-space:nowrap;max-width:96vw;font-weight:900;letter-spacing:.06em;font-size:26px;padding:6px 22px;border-radius:12px;color:#111;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .psaball.set{background:#ffd23f}
  .psaball.match{background:#ff4b4b;color:#fff}
  .psabar{display:inline-flex;align-items:stretch;background:#fff;border-radius:16px;box-shadow:0 8px 34px rgba(0,0,0,.4);
    overflow:hidden;font-weight:800;color:#111;white-space:nowrap;max-width:96vw;line-height:1}
  .psabar .ps-name{display:inline-flex;align-items:center;gap:.28em;padding:.42em .7em;box-sizing:content-box}
  .psabar .ps-name.n1{justify-content:flex-end}
  .psabar .ps-name.n2{justify-content:flex-start}
  .psabar .ps-t{overflow:hidden;text-overflow:ellipsis}
  .psabar .ps-cc{color:#6b7280;font-size:.62em;font-weight:800}
  .psabar .ps-g{background:#1b1b1b;color:#fff;display:flex;align-items:center;justify-content:center;min-width:1.5em;padding:0 .35em;font-size:1.05em}
  .psabar .ps-pts{background:#fff;color:#111;display:flex;align-items:center;justify-content:center;padding:0 .6em;font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .psabar .ps-dot{width:.34em;height:.34em;border-radius:50%;background:#1a9bff;flex:0 0 auto;margin:0 .1em}
  .psasets{display:flex;justify-content:center;gap:10px}
  .psasets .ps-set{background:#1b1b1b;color:#e8eef7;border-radius:9px;padding:6px 16px;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .statframe{background:rgba(6,10,16,.96);border:2px solid rgba(255,255,255,.16);border-radius:22px;padding:24px 30px;max-width:min(90vw,1000px);box-shadow:0 20px 80px rgba(0,0,0,.55);color:#fff;text-align:center}
  .statframe .stat-title{font-size:34px;font-weight:900;margin-bottom:10px}
  .statframe .stat-names{display:flex;gap:28px;justify-content:center;font-size:20px;font-weight:800;margin-bottom:16px}
  .statframe .sn1{color:#7cc0ff} .statframe .sn2{color:#ff9a9a}
  .statframe .stat-seq{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:900px}
  .statframe .sd{width:16px;height:28px;border-radius:4px}
  .statframe .sd1{background:#1a9bff} .statframe .sd2{background:#ff4b4b}
  .psaline .nm{flex:1 1 0;min-width:0;max-width:none;background:#fff;border:6px solid #999;border-radius:14px;
    display:flex;align-items:center;gap:12px;padding:16px 30px;font-weight:800;color:#111;line-height:1.05}
  .psaline .nm .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .psaline .nm.p1{border-color:var(--blue);justify-content:flex-start}
  .psaline .nm.p2{border-color:var(--red);justify-content:flex-end}
  .psaline .pts{background:#2b2b2b;color:#fff;border-radius:12px;flex:0 0 auto;min-width:96px;padding:0 12px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;font-variant-numeric:tabular-nums}
  .psaline .games{background:#fff;color:#111;border-radius:12px;flex:0 0 auto;min-width:150px;padding:0 16px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;letter-spacing:2px;font-variant-numeric:tabular-nums}

  /* ===== SCOREBOARD (Vollbild) ===== */
  .sb{width:min(1100px,94vw)}
  .sb .top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:14px}
  .sb .name{background:#fff;border:6px solid #999;border-radius:14px;padding:14px 20px;font-size:min(5vw,44px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:12px}
  .sb .name.p1{border-color:var(--blue)}
  .sb .name.p2{border-color:var(--red);justify-content:flex-end}
  .sb .center{display:flex;flex-direction:column;align-items:center;gap:6px}
  .sb .gp{display:flex;gap:8px}
  .sb .gp b{background:#1b1b1b;color:#fff;border-radius:8px;min-width:44px;text-align:center;font-size:30px;padding:2px 6px;font-variant-numeric:tabular-nums}
  .sb .serve{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid #111;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
  .sb .big{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .sb .bigbox{background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;height:min(52vh,420px)}
  .sb .bigbox .n{font-size:min(34vh,300px);font-weight:800;color:#222;line-height:1;font-variant-numeric:tabular-nums}

  /* ===== FULLSCORE ===== */
  .fs{width:min(1150px,96vw)}
  .fs .title{background:#111;color:#fff;font-weight:800;font-size:min(2.4vw,24px);padding:8px 14px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;gap:16px;border:3px solid #111}
  .fs .title .r{color:#eee}
  .fs .rowline{display:flex;align-items:stretch;gap:6px;margin-top:6px}
  .fs .frow{display:flex;align-items:stretch;gap:6px;flex:1;min-width:0}
  .fs .flagcell{width:70px;border-radius:6px;flex:0 0 auto}
  .fs .name{flex:1;background:#fff;border-radius:6px;display:flex;align-items:center;gap:12px;padding:6px 16px;font-size:min(3.2vw,32px);font-weight:600;min-width:0}
  .fs .name .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fs .nat{color:#666;font-weight:700;font-size:.8em}
  .fs .cur{background:#2b2b2b;color:#fff;border-radius:6px;width:64px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
  .fs .set{background:#efeff0;border:2px solid #cfd2d6;border-radius:6px;width:56px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#222;font-variant-numeric:tabular-nums}
  .fs .set.win{background:#d7f0d7;border-color:#7bbf7b}

  /* ===== MODERN ===== */
  .mod{width:min(1120px,95vw);position:relative;padding:20px 0}
  .mod .flagtop{position:absolute;top:-6px;left:8px;width:78px;height:52px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .mod .flagbot{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:70px;height:100px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .mod .mrow{display:flex;align-items:stretch;gap:8px;margin:8px 0}
  .mod .skew{transform:skewX(-11deg)}
  .mod .name{flex:1;background:#111;color:#fff;border-radius:6px;display:flex;align-items:center;padding:10px 26px;font-style:italic;font-weight:800;font-size:min(3.4vw,34px);min-width:0}
  .mod .name .t{transform:skewX(11deg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mod .cur,.mod .set{background:#111;color:#fff;border-radius:6px;width:64px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .mod .cur span,.mod .set span{transform:skewX(11deg)}
  .mod .cur{color:var(--yellow)}
</style>
</head>
<body>
<div id="stage"><div class="idle" id="idle">–</div></div>
<div id="stimer" class="stimer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="auth.js"></script>
<script>
const params=new URLSearchParams(location.search);
const COURT=Number(params.get('court'))||1;
const VENUE=params.get('loc')||null;
let VIEW=params.get('view')||'scoreboard';
let SET=null, MATCH=null, ALL=[];
document.title='Court '+COURT+' – '+VIEW;

// Flaggenbild (echte Bilder statt Emoji – wichtig für OBS/Windows)
function flagUrl(code, region){
  const rf = (typeof regionFlagUrl==='function' && regionFlagUrl(region,80)) || '';
  if(rf) return rf;
  if(!code) return '';
  let c=String(code).toLowerCase().trim();
  if(!/^[a-z]{2}$/.test(c) && !['eng','sct','wls'].includes(c)){
    c=(typeof countryToISO==='function' && countryToISO(code)) || '';
  }
  if(!c) return '';
  const map={eng:'gb-eng',sct:'gb-sct',wls:'gb-wls'};
  return `https://flagcdn.com/h80/${map[c]||c}.png`;
}
function flagCss(code, region){ const u=flagUrl(code, region); return u?`background-image:url("${u}")`:''; }
// Flaggen-Element (Bundesland bevorzugt), '' wenn keine gültige Angabe
function flagSpan(code,cls,style,region){ const css=flagCss(code,region); return css?`<span class="${cls}" style="${style?style+';':''}${css}"></span>`:''; }
function flagDiv(code,cls,style,region){ const css=flagCss(code,region); return css?`<div class="${cls}" style="${style?style+';':''}${css}"></div>`:''; }
const NAT3={at:'AUT',be:'BEL',bg:'BUL',cz:'CZE',dk:'DEN',eg:'EGY',eng:'ENG',ee:'EST',fi:'FIN',
  fr:'FRA',de:'GER',hu:'HUN',ie:'IRL',lv:'LAT',lt:'LTU',mu:'MRI',nl:'NED',no:'NOR',pl:'POL',
  pt:'POR',ro:'ROU',es:'ESP',se:'SWE',ch:'SUI',tr:'TUR',ua:'UKR',sct:'SCO',wls:'WAL',us:'USA',
  af:'AFG',ca:'CAN',in:'IND',au:'AUS',jp:'JPN',my:'MAS',hk:'HKG',it:'ITA',gr:'GRE'};
function nat(code){ if(!code) return ''; const c=String(code).toLowerCase(); return NAT3[c]||c.toUpperCase(); }

function clock(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

let _betwAt=0, _betwKey='';
function liveState(){
  if(!MATCH||!MATCH.state) return null;
  const s=MATCH.state;
  let p1=s.cur?s.cur.p1:0, p2=s.cur?s.cur.p2:0;
  if(s.status==='between'){                                   // Satzpause: 15s letzten Stand halten, dann 0:0
    const key=MATCH.id+':'+((s.games||[]).length);
    if(_betwKey!==key){ _betwKey=key; _betwAt=Date.now(); }
    if(Date.now()-_betwAt >= 15000){ p1=0; p2=0; }
  } else { _betwKey=''; }
  return {
    p1:MATCH.player1_name + (MATCH.player1_seed?(' ['+MATCH.player1_seed+']'):''),
    p2:MATCH.player2_name + (MATCH.player2_seed?(' ['+MATCH.player2_seed+']'):''),
    c1:MATCH.player1_country, c2:MATCH.player2_country,
    r1:MATCH.player1_region, r2:MATCH.player2_region,
    pts1:p1, pts2:p2,
    server:s.cur?s.cur.server:null, side:s.cur?s.cur.side:'R',
    g1:s.gamesWon1||0, g2:s.gamesWon2||0,
    games:s.games||[], bestOf:s.bestOf||MATCH.best_of||3,
    event:MATCH.event||MATCH.draw||'', round:MATCH.round||'',
    timer:s.timer||null, mstatus:s.status||'',
    shirt1:s.shirt1||null, shirt2:s.shirt2||null,
    p1raw:MATCH.player1_name||'', p2raw:MATCH.player2_name||'',
    cc1:(MATCH.player1_country||'').toUpperCase(), cc2:(MATCH.player2_country||'').toUpperCase(),
  };
}

function setBg(){ document.body.style.background=(SET&&SET.green)||'#82F84E'; }

function render(){
  setBg();
  const stage=document.getElementById('stage');
  const d=liveState();
  // Match beendet -> Match-Over-Anzeige (0-10s), danach Endstatus + nächste Spiele
  if(d && d.mstatus==='finished'){
    const at=finishAtOf();
    if(Date.now()-at < 5000){
      // 0-5s: Endstand kurz weiter zeigen (keine Gewinner-Einzelmeldung)
      if(VIEW==='fullscore') stage.innerHTML=viewFull(d);
      else if(VIEW==='modern') stage.innerHTML=viewModern(d);
      else if(VIEW==='psaline'){ stage.innerHTML=viewPsa(d); requestAnimationFrame(adjustPsa); }
      else stage.innerHTML=viewScore(d);
    } else {
      stage.innerHTML = viewMatchOver(d);
    }
    document.title='Court '+COURT+' – Match Over';
    paintTimer(); return;
  }
  if(!d){
    // kein laufendes Match -> Vorschau der kommenden Spiele auf diesem Court
    stage.innerHTML = viewUpcoming();
    paintTimer(); return;
  }
  document.title='Court '+COURT+' – '+VIEW;
  if(VIEW==='psaline') stage.innerHTML=viewPsa(d);
  else if(VIEW==='fullscore') stage.innerHTML=viewFull(d);
  else if(VIEW==='modern') stage.innerHTML=viewModern(d);
  else stage.innerHTML=viewScore(d);
  paintTimer();
  if(VIEW==='psaline') requestAnimationFrame(adjustPsa);
}

// ---- Match-Over / Vorschau (Courtview) ----  (kein „Undo" auf der Courtview!)
function escS(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
let _finAt=0, _finId=null;
function finishAtOf(){
  if(!MATCH){ _finId=null; _finAt=0; return 0; }
  const s=MATCH.state||{};
  if(s.status!=='finished'){ if(_finId===MATCH.id){ _finId=null; _finAt=0; } return 0; }
  if(s.finishedAt) return s.finishedAt;
  if(_finId!==MATCH.id){ _finId=MATCH.id; _finAt=Date.now(); }   // Fallback: erster Sichtzeitpunkt
  return _finAt;
}
function timeStr(m){ return m.scheduled_time ? (String(m.scheduled_time).slice(0,5)+' ') : ''; }
function upcomingForCourt(){
  return ALL.filter(m => m.status==='scheduled' && m.court_no===COURT && (!VENUE || !m.venue_id || m.venue_id===VENUE))
    .sort((a,b)=>(a.sort_ts||0)-(b.sort_ts||0));
}
function stTime(raw){ if(!raw) return ''; const s=String(raw); const m=s.match(/(\d{1,2}:\d{2})\s*$/)||s.match(/(\d{1,2}:\d{2})/); return m?m[1]:''; }
function nextBlock(limit){
  const up=upcomingForCourt(); if(!up.length) return '';
  return `<div class="mo-next">`+up.slice(0,limit||3).map((m,i)=>{
    const t=stTime(m.scheduled_time);
    const cat=[m.event||m.draw, m.round, m.match_no?('#'+m.match_no):''].filter(Boolean).map(escS).join(' · ');
    const fl1=flagSpan(m.player1_country,'flagimg','width:34px;height:23px;box-shadow:0 0 0 1px rgba(255,255,255,.15)',m.player1_region);
    const fl2=flagSpan(m.player2_country,'flagimg','width:34px;height:23px;box-shadow:0 0 0 1px rgba(255,255,255,.15)',m.player2_region);
    return `<div class="mo-card${i===0?' first':''}">
      <div class="mo-when"><div class="mo-time">${escS(t)||'--:--'}</div><div class="mo-lbl">${i===0?'als nächstes':'später'}</div></div>
      <div class="mo-cbody">
        <div class="mo-crow">${fl1}<b>${escS(m.player1_name)}</b> <span class="mo-vs">vs</span> ${fl2}<b>${escS(m.player2_name)}</b></div>
        ${cat?`<div class="mo-cmeta">${cat}</div>`:''}
        ${m.referee?`<div class="mo-cref"><b>Schiri:</b> ${escS(m.referee)}</div>`:''}
      </div>
    </div>`;
  }).join('')+`</div>`;
}
function viewMatchOver(d){
  const sets=(d.games||[]).map(g=>`${g.p1}-${g.p2}`).join('  ');
  const logo=(SET&&SET.logoUrl)?`<img class="mo-logo" src="${SET.logoUrl}" alt="">`:'';
  return `<div class="mo"><div class="mo-frame">
    ${logo}
    <div class="mo-players">${escS(d.p1raw)} <span class="mo-vs2">vs</span> ${escS(d.p2raw)}</div>
    <div class="mo-score">${d.g1}–${d.g2}${sets?`<span class="mo-sets">${escS(sets)}</span>`:''}</div>
    <div class="mo-heading">Nächste Spiele auf Court ${COURT}</div>
    ${nextBlock(3)}
  </div></div>`;
}
function viewUpcoming(){
  const up=upcomingForCourt();
  if(!up.length) return `<div class="idle">Court ${COURT}</div>`;
  const logo=(SET&&SET.logoUrl)?`<img class="mo-logo" src="${SET.logoUrl}" alt="">`:'';
  return `<div class="mo"><div class="mo-frame">${logo}<div class="mo-heading">Nächste Spiele auf Court ${COURT}</div>${nextBlock(4)}</div></div>`;
}

// ---- Timer-Anzeige (aus den Spieldaten, lokal heruntergezählt) ----
function fmtT(s){ s=Math.max(0,s|0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function timerInfo(){
  const d=liveState(); if(!d||!d.timer) return null;
  const t=d.timer; let left;
  if(t.running && t.endsAt){ left=Math.round((t.endsAt-Date.now())/1000); if(left<=0) return null; }
  else if(!t.running && t.sec>0){ left=t.sec; }   // pausiert
  else return null;
  return { label:t.label||'Timer', left, paused:!t.running };
}
function paintTimer(){
  const el=document.getElementById('stimer'); if(!el) return;
  const info=timerInfo();
  if(!info){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML=`<span class="lbl">${info.label}${info.paused?' · Pause':''}</span><span class="clk">${fmtT(info.left)}</span>`;
}
setInterval(paintTimer,1000);

function setCols(d,who){
  // Sätze (abgeschlossene Spiele) für Spieler 'who' + evtl. leere Kästen bis bestOf
  const arr=d.games.map(g=>({v: who===1?g.p1:g.p2, win:(g.winner===who)}));
  const total=Math.max(d.bestOf, arr.length);
  const cells=[];
  for(let i=0;i<total;i++){ cells.push(arr[i]||null); }
  return cells;
}

function psaNameFont(a,b){
  const n=Math.max((''+(a||'')).length,(''+(b||'')).length);
  if(n<=12) return 56; if(n<=16) return 48; if(n<=20) return 42; if(n<=24) return 36; if(n<=30) return 31; return 27;
}
function psaNameFont2(a,b){
  const n=Math.max(String(a||'').length, String(b||'').length);
  if(n<=14) return 40; if(n<=18) return 34; if(n<=22) return 30; if(n<=26) return 26; if(n<=32) return 22; return 19;
}
function viewPsa(d){
  const fs=psaNameFont2(d.p1raw+(d.cc1?(' ('+d.cc1+')'):''), d.p2raw+(d.cc2?(' ('+d.cc2+')'):''));
  const dot1=d.server===1?'<span class="ps-dot"></span>':'';
  const dot2=d.server===2?'<span class="ps-dot"></span>':'';
  const sets=(d.games||[]).map(g=>`<span class="ps-set">${g.p1}-${g.p2}</span>`).join('');
  // Satz-/Matchball
  const N=11, need=Math.floor((d.bestOf||3)/2)+1;
  const gb=(me,opp)=>(me+1>=N)&&(me+1-opp>=2);
  let ball='';
  if(d.mstatus==='playing'){
    const b1=gb(d.pts1,d.pts2), b2=gb(d.pts2,d.pts1);
    if(b1||b2){ const who=b1?d.p1raw:d.p2raw; const gw=(b1?d.g1:d.g2)+1; const isMatch=gw>=need;
      ball=`<div class="psaball ${isMatch?'match':'set'}">${isMatch?'MATCHBALL':'SATZBALL'} · ${escS(who)}</div>`; }
  }
  return `<div class="psawrap">
    ${ball}
    <div class="psabar" style="font-size:${fs}px">
      <span class="ps-name n1"><span class="ps-t">${escS(d.p1raw)}</span>${d.cc1?` <span class="ps-cc">(${escS(d.cc1)})</span>`:''}${dot1}</span>
      <span class="ps-g">${d.g1}</span>
      <span class="ps-pts">${d.pts1} - ${d.pts2}</span>
      <span class="ps-g">${d.g2}</span>
      <span class="ps-name n2">${dot2}<span class="ps-t">${escS(d.p2raw)}</span>${d.cc2?` <span class="ps-cc">(${escS(d.cc2)})</span>`:''}</span>
    </div>
    ${sets?`<div class="psasets">${sets}</div>`:''}
  </div>`;
}
function adjustPsa(){
  const n1=document.querySelector('.psabar .ps-name.n1'), n2=document.querySelector('.psabar .ps-name.n2');
  if(!n1||!n2) return;
  n1.style.width='auto'; n2.style.width='auto';
  const w=Math.ceil(Math.max(n1.getBoundingClientRect().width, n2.getBoundingClientRect().width));
  n1.style.width=w+'px'; n2.style.width=w+'px';
}

function txtOn(hex){ try{ const c=String(hex).replace('#',''); const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16); if([r,g,b].some(isNaN)) return '#fff'; return (0.299*r+0.587*g+0.114*b)/255>0.6?'#111':'#fff'; }catch(e){ return '#fff'; } }
function viewScore(d){
  const side=d.side==='L'?'L':'R';
  const sh1=d.shirt1||'#000', sh2=d.shirt2||'#000';
  return `<div class="sb">
    <div class="top">
      <div class="name p1" style="background:${sh1};color:${txtOn(sh1)}">${flagSpan(d.c1,'flagimg','width:44px;height:30px',d.r1)}${d.p1}${d.server===1?'<span class="dot"></span>':''}</div>
      <div class="center">
        <div class="gp"><b>${d.g1}</b><b>${d.g2}</b></div>
        <div class="serve">${side}</div>
      </div>
      <div class="name p2" style="background:${sh2};color:${txtOn(sh2)}">${d.server===2?'<span class="dot"></span>':''}${d.p2}${flagSpan(d.c2,'flagimg','width:44px;height:30px',d.r2)}</div>
    </div>
    <div class="big">
      <div class="bigbox"><span class="n">${d.pts1}</span></div>
      <div class="bigbox"><span class="n">${d.pts2}</span></div>
    </div>
  </div>`;
}

function viewFull(d){
  const cols1=setCols(d,1), cols2=setCols(d,2);
  const setCells=cols=>cols.map(c=>`<div class="set ${c&&c.win?'win':''}">${c?c.v:''}</div>`).join('');
  const title=(SET&&SET.tournamentName)||'';
  return `<div class="fs">
    <div class="title"><span>${[title,d.event,d.round].filter(Boolean).join(' — ')}</span>
      <span class="r">Court: ${COURT}&nbsp;&nbsp;${clock()}</span></div>
    <div class="rowline"><div class="frow">
      ${flagDiv(d.c1,'flagcell flagimg','',d.r1)}
      <div class="name"><span class="t">${d.p1} <span class="nat">[${nat(d.c1)}]</span></span>${d.server===1?'<span class="dot"></span>':''}</div>
      <div class="cur">${d.pts1}</div></div>${setCells(cols1)}
    </div>
    <div class="rowline"><div class="frow">
      ${flagDiv(d.c2,'flagcell flagimg','',d.r2)}
      <div class="name"><span class="t">${d.p2} <span class="nat">[${nat(d.c2)}]</span></span>${d.server===2?'<span class="dot"></span>':''}</div>
      <div class="cur">${d.pts2}</div></div>${setCells(cols2)}
    </div>
  </div>`;
}

function viewModern(d){
  const cols1=setCols(d,1), cols2=setCols(d,2);
  const cells=cols=>cols.map(c=>`<div class="set skew"><span>${c?c.v:''}</span></div>`).join('');
  return `<div class="mod">
    ${flagDiv(d.c1,'flagtop flagimg','',d.r1)}
    <div class="mrow">
      <div class="name skew"><span class="t">${d.p1}${d.server===1?' •':''}</span></div>
      <div class="cur skew"><span>${d.pts1}</span></div>${cells(cols1)}
    </div>
    <div class="mrow">
      <div class="name skew"><span class="t">${d.p2}${d.server===2?' •':''}</span></div>
      <div class="cur skew"><span>${d.pts2}</span></div>${cells(cols2)}
    </div>
    ${flagDiv(d.c2,'flagbot flagimg','',d.r2)}
  </div>`;
}

// ---- Steuerung ----
function setView(v){ VIEW=v; const u=new URL(location); u.searchParams.set('view',v); history.replaceState(null,'',u); render(); }
function goFull(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen&&document.exitFullscreen(); }
document.addEventListener('keydown',e=>{ if(e.key==='f') goFull(); });

// ---- Daten / Realtime ----
async function refreshSettings(){ SET=await Store.getSettings(); setBg(); render(); load(); }
async function load(){
  ALL=await Store.listMatches();
  MATCH=ALL.find(m=>m.court_id===COURT && m.status==='live' && (!VENUE || !m.venue_id || m.venue_id===VENUE))||null;
  render();
}
setView(VIEW);
Auth.guard('view').then(()=>{
  Store.subscribeAll(load);
  Store.subscribeSettings(refreshSettings);
  refreshSettings();
  load();
});
setInterval(()=>{ if(VIEW==='fullscore') render(); },30000); // Uhr aktualisieren
setInterval(()=>{ const d=liveState(); if(d && d.mstatus==='between') render(); }, 1000); // Satzpause: 15s letzten Stand, dann 0:0
setInterval(()=>{ const s=MATCH&&MATCH.state; if((s&&s.status==='finished') || !MATCH) render(); },1000); // Match-Over-Übergang & Vorschau
</script>
