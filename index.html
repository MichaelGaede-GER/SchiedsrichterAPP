<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squash – Verwaltung</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2230; --panel2:#232d3d; --line:#31405a;
    --ink:#eef3fb; --muted:#8aa0bf; --blue:#2f6bff; --red:#e5484d;
    --green:#2fbf71; --amber:#f2b134;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;
    background:linear-gradient(90deg,#161d29,#0f1419);border-bottom:1px solid var(--line)}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
  .mode{margin-left:auto;font-size:12.5px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted)}
  .mode.live{color:var(--green);border-color:#1e5b3d;background:#10261c}
  .mode.local{color:var(--amber);border-color:#5b4a1e;background:#241f10}
  main{padding:22px;max-width:1400px;margin:0 auto}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);
    margin:26px 0 12px;font-weight:700}

  /* ---- Courts ---- */
  .courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .court{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;
    padding:14px;min-height:150px;transition:border-color .15s,background .15s;position:relative}
  .court.drop{border-color:var(--blue);background:#14203a;border-style:dashed}
  .court .cnum{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1px}
  .court .empty{color:var(--muted);font-size:14px;margin-top:34px;text-align:center}
  .court .empty small{display:block;margin-top:6px;opacity:.7}
  .court.free{cursor:pointer}
  .court.free:hover{border-color:var(--blue)}

  .live{margin-top:6px}
  .live .row{display:flex;align-items:center;gap:8px;padding:4px 0}
  .live .nm{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .live .sc{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;min-width:28px;text-align:right}
  .live .p1 .nm{color:#8db4ff}.live .p2 .nm{color:#ff9a9d}
  .live .meta{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
  .badge.playing{background:#10261c;color:var(--green);border:1px solid #1e5b3d}
  .badge.finished{background:#2a1a12;color:var(--amber);border:1px solid #6b4a1e}
  .court .actions{margin-top:10px;display:flex;gap:8px}
  button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:8px 12px;font-weight:600}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-green{background:var(--green);color:#08130c}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn-ghost:hover{color:var(--ink);border-color:var(--muted)}
  .btn-sm{padding:5px 9px;font-size:12px}

  /* ---- Ansetzungen ---- */
  table{width:100%;border-collapse:collapse}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .m{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    padding:12px 16px;border-bottom:1px solid var(--line);cursor:grab}
  .m:last-child{border-bottom:none}
  .m.sel{background:#14203a;outline:1px solid var(--blue)}
  .m .info{font-size:12px;color:var(--muted);min-width:110px}
  .m .info b{color:var(--ink);font-weight:600}
  .m .teams{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .m .team{display:flex;align-items:center;gap:6px;font-weight:600}
  .m .team .fl{font-size:18px}
  .m .vs{color:var(--muted);font-size:12px;padding:0 4px}
  .m .p1n{color:#8db4ff}.m .p2n{color:#ff9a9d}
  .m .ctrl{display:flex;align-items:center;gap:8px}
  select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 8px;font:inherit}
  .hint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
  .emptyrow{padding:22px;text-align:center;color:var(--muted)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:14px;padding:20px;width:min(460px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog h3{margin:0 0 14px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:12px;color:var(--muted)}
  .field input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;font:inherit}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#232d3d;border:1px solid var(--line);padding:11px 18px;border-radius:10px;
    font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .selbar{position:sticky;top:0;z-index:5;background:#14203a;border:1px solid var(--blue);
    border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px;display:none;
    align-items:center;gap:10px}
  .selbar.show{display:flex}
</style>
</head>
<body>
<header>
  <h1>🎾 Squash&nbsp;·&nbsp;Turnierverwaltung</h1>
  <span id="mode" class="mode">…</span>
</header>

<main>
  <div id="selbar" class="selbar">
    <span id="selText"></span>
    <span style="margin-left:auto;color:var(--muted)">Court oben antippen zum Zuweisen</span>
    <button class="btn-ghost btn-sm" onclick="clearSel()">Abbrechen</button>
  </div>

  <h2>Courts</h2>
  <div id="courts" class="courts"></div>

  <h2>Angesetzte Spiele</h2>
  <div class="card"><div id="sched"></div></div>
  <p class="hint">Spiel auf einen Court <b>ziehen</b> – oder Spiel antippen, dann Court antippen.
     Best-of pro Spiel links einstellbar.</p>

  <div class="toolbar">
    <button class="btn-primary btn-sm" onclick="openAdd()">+ Spiel hinzufügen</button>
    <button class="btn-ghost btn-sm" onclick="seed()">Demo-Daten laden</button>
    <button class="btn-ghost btn-sm" onclick="clearAll()">Alles löschen</button>
  </div>

  <h2 style="margin-top:30px">Bestätigte Ergebnisse</h2>
  <div class="card"><div id="done"></div></div>
</main>

<dialog id="addDlg">
  <h3>Spiel hinzufügen</h3>
  <div class="grid2">
    <div class="field"><label>Draw</label><input id="f_draw" value="Ju11"></div>
    <div class="field"><label>Runde</label><input id="f_round" value="RR1"></div>
  </div>
  <div class="grid2">
    <div class="field"><label>Spieler 1</label><input id="f_p1" placeholder="Vorname Nachname"></div>
    <div class="field"><label>Land 1 (ISO, z.B. de)</label><input id="f_c1" value="de" maxlength="2"></div>
  </div>
  <div class="grid2">
    <div class="field"><label>Spieler 2</label><input id="f_p2" placeholder="Vorname Nachname"></div>
    <div class="field"><label>Land 2 (ISO)</label><input id="f_c2" value="de" maxlength="2"></div>
  </div>
  <div class="field"><label>Best of</label>
    <select id="f_bo"><option value="3">3</option><option value="5">5</option></select></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
    <button class="btn-ghost" onclick="addDlg.close()">Abbrechen</button>
    <button class="btn-primary" onclick="addMatch()">Speichern</button>
  </div>
</dialog>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const COURTS = (window.CONFIG.COURTS)||[1,2,3,4,5,6];
let MATCHES = [];
let selectedMatch = null;   // für Tap-Zuweisung

// Mode-Banner
const modeEl = document.getElementById('mode');
if (Store.ready){ modeEl.textContent = '● Supabase verbunden'; modeEl.className='mode live'; }
else { modeEl.textContent = '● Lokaler Testmodus (nur dieser Browser)'; modeEl.className='mode local'; }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200);
}

async function load(){
  MATCHES = await Store.listMatches();
  render();
}

function render(){
  renderCourts();
  renderSched();
  renderDone();
}

function scoreLine(m, who){
  const st = m.state;
  if(!st) return '0';
  return st['gamesWon'+who] ?? 0;
}

function renderCourts(){
  const wrap=document.getElementById('courts'); wrap.innerHTML='';
  COURTS.forEach(cid=>{
    const live = MATCHES.find(m=>m.court_id===cid && (m.status==='live'));
    const div=document.createElement('div');
    div.className='court'+(live?'':' free');
    div.dataset.court=cid;

    if(!live){
      div.innerHTML=`<div class="cnum">COURT ${cid}</div>
        <div class="empty">frei<small>Spiel hierher ziehen</small></div>`;
      // Drop-Ziel
      div.addEventListener('dragover',e=>{e.preventDefault();div.classList.add('drop');});
      div.addEventListener('dragleave',()=>div.classList.remove('drop'));
      div.addEventListener('drop',e=>{e.preventDefault();div.classList.remove('drop');
        const id=e.dataTransfer.getData('text/id'); if(id) assign(id,cid);});
      // Tap-Zuweisung
      div.addEventListener('click',()=>{ if(selectedMatch) assign(selectedMatch,cid); });
    } else {
      const s=live.state||{};
      const g1=s.gamesWon1??0, g2=s.gamesWon2??0;
      const p1=(s.cur?s.cur.p1:0), p2=(s.cur?s.cur.p2:0);
      const fin = live.status==='live' && s.status==='finished';
      const badge = fin
        ? `<span class="badge finished">Beendet ${live.result||''}</span>`
        : `<span class="badge playing">Läuft</span>`;
      div.innerHTML=`<div class="cnum">COURT ${cid}</div>
        <div class="live">
          <div class="row p1"><span class="nm">${flagEmoji(live.player1_country)} ${live.player1_name}</span><span class="sc">${p1}</span></div>
          <div class="row p2"><span class="nm">${flagEmoji(live.player2_country)} ${live.player2_name}</span><span class="sc">${p2}</span></div>
          <div class="meta"><span>Satz ${g1}–${g2} · Bo${live.best_of}</span>${badge}</div>
          <div class="actions">
            ${fin ? `<button class="btn-green btn-sm" onclick="confirmR('${live.id}')">Bestätigen &amp; zurückholen</button>`
                  : `<button class="btn-ghost btn-sm" onclick="unassign('${live.id}')">Vom Court nehmen</button>`}
          </div>
        </div>`;
    }
    wrap.appendChild(div);
  });
}

function renderSched(){
  const el=document.getElementById('sched');
  const rows=MATCHES.filter(m=>!m.court_id && m.status!=='confirmed');
  if(!rows.length){ el.innerHTML='<div class="emptyrow emp'+'tyrow">Keine offenen Ansetzungen. „Demo-Daten laden“ oder „+ Spiel hinzufügen“.</div>'; return; }
  el.innerHTML='';
  rows.forEach(m=>{
    const row=document.createElement('div');
    row.className='m'+(selectedMatch===m.id?' sel':'');
    row.draggable=true;
    row.innerHTML=`
      <div class="info"><b>${m.draw||''}</b> · ${m.round||''}<br>${m.match_no||''}</div>
      <div class="teams">
        <span class="team"><span class="fl">${flagEmoji(m.player1_country)}</span><span class="p1n">${m.player1_name}</span></span>
        <span class="vs">vs</span>
        <span class="team"><span class="fl">${flagEmoji(m.player2_country)}</span><span class="p2n">${m.player2_name}</span></span>
      </div>
      <div class="ctrl">
        <label style="font-size:11px;color:var(--muted)">Bo</label>
        <select onchange="setBo('${m.id}',this.value)">
          <option value="3"${m.best_of==3?' selected':''}>3</option>
          <option value="5"${m.best_of==5?' selected':''}>5</option>
        </select>
      </div>`;
    row.addEventListener('dragstart',e=>e.dataTransfer.setData('text/id',m.id));
    row.querySelector('.teams').addEventListener('click',()=>toggleSel(m.id));
    row.querySelector('.info').addEventListener('click',()=>toggleSel(m.id));
    el.appendChild(row);
  });
}

function renderDone(){
  const el=document.getElementById('done');
  const rows=MATCHES.filter(m=>m.status==='confirmed');
  if(!rows.length){ el.innerHTML='<div class="emp'+'tyrow">Noch keine bestätigten Ergebnisse.</div>'; return; }
  el.innerHTML='';
  rows.forEach(m=>{
    const winName = m.winner==1?m.player1_name:m.winner==2?m.player2_name:'';
    const row=document.createElement('div'); row.className='m'; row.draggable=false;
    row.style.cursor='default';
    row.innerHTML=`
      <div class="info"><b>${m.draw||''}</b> · ${m.round||''}</div>
      <div class="teams">
        <span class="team"><span class="p1n">${m.player1_name}</span></span>
        <span class="vs">${m.result||''}</span>
        <span class="team"><span class="p2n">${m.player2_name}</span></span>
      </div>
      <div class="ctrl" style="color:var(--green);font-weight:700">🏆 ${winName}</div>`;
    el.appendChild(row);
  });
}

// ---- Auswahl (Tap-Modus) ----
function toggleSel(id){ selectedMatch = selectedMatch===id?null:id; updateSelBar(); render(); }
function clearSel(){ selectedMatch=null; updateSelBar(); render(); }
function updateSelBar(){
  const bar=document.getElementById('selbar');
  if(selectedMatch){
    const m=MATCHES.find(x=>x.id===selectedMatch);
    document.getElementById('selText').textContent =
      `Ausgewählt: ${m.player1_name} vs ${m.player2_name}`;
    bar.classList.add('show');
  } else bar.classList.remove('show');
}

// ---- Aktionen ----
async function assign(id,cid){
  const m=MATCHES.find(x=>x.id===id); if(!m) return;
  try{
    await Store.assignToCourt(id,cid,Number(m.best_of)||3);
    selectedMatch=null; updateSelBar();
    toast(`Auf Court ${cid} gelegt`);
  }catch(e){ toast(e.message); }
}
async function unassign(id){ await Store.unassign(id); toast('Zurück in die Ansetzungen'); }
async function confirmR(id){ await Store.confirmResult(id); toast('Ergebnis bestätigt'); }
async function setBo(id,v){ await Store.updateMatch(id,{best_of:Number(v)}); }

// ---- Dialog ----
const addDlg=document.getElementById('addDlg');
function openAdd(){ addDlg.showModal(); }
async function addMatch(){
  const g=id=>document.getElementById(id).value.trim();
  if(!g('f_p1')||!g('f_p2')){ toast('Bitte beide Spieler eintragen'); return; }
  await Store.insertMatch({
    draw:g('f_draw'), round:g('f_round'), match_no:'',
    player1_name:g('f_p1'), player1_country:g('f_c1')||'de',
    player2_name:g('f_p2'), player2_country:g('f_c2')||'de',
    best_of:Number(g('f_bo')), court_id:null, status:'scheduled',
    state:null, result:null, winner:null,
  });
  addDlg.close(); toast('Spiel angelegt');
}

async function seed(){
  const demo=[
    ['Ju11','RR1','#1','Jonas Buchholz','de','Johann Middele','de',3],
    ['Ju11','RR1','#2','Max Böhme','de','Bennet Bloching','de',3],
    ['U13/U17','Group A','#3','Dominik Bodo','de','Ahmad Wali Sherzad','af',5],
  ];
  for(const d of demo){
    await Store.insertMatch({
      draw:d[0],round:d[1],match_no:d[2],
      player1_name:d[3],player1_country:d[4],
      player2_name:d[5],player2_country:d[6],
      best_of:d[7],court_id:null,status:'scheduled',
      state:null,result:null,winner:null,
    });
  }
  toast('Demo-Daten geladen');
}
async function clearAll(){ if(confirm('Wirklich ALLE Spiele löschen?')){ await Store.deleteAll(); toast('Gelöscht'); } }

// Realtime
Store.subscribeAll(load);
load();
</script>
</body>
</html>
