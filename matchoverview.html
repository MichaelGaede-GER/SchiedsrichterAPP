<!DOCTYPE html>
<html lang="de">
<head>
<script src="i18n.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Match Overview</title>
<style>
  :root{ --yellow:#ffd23f; --live:#ff4b4b; --muted:#9fb3cc; --line:rgba(255,255,255,.08); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1c;color:#fff;
    font-family:"Segoe UI",Arial,system-ui,sans-serif}
  #app{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(130% 120% at 50% -12%, #182238 0%, #0b0f1c 55%, #1b1030 100%)}
  #bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;pointer-events:none}

  /* Kopf */
  .hd{position:absolute;left:0;right:0;top:0;height:10vh;display:flex;align-items:center;gap:1.4vw;
    padding:0 1.8vw;background:linear-gradient(180deg,#141b2b,#0f1522);color:#fff;border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 .6vh 2vh rgba(0,0,0,.45)}
  .hd-logo{height:8.6vh;max-width:32vw;object-fit:contain;flex:0 0 auto;image-rendering:auto}
  .hd-name{font-size:4.4vh;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
  .hd-name.two{white-space:normal;line-height:1.08;max-height:9vh;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  .hd-title{font-size:4.4vh;font-weight:900;color:#ff4b5c;white-space:nowrap;letter-spacing:.01em}
  .hd-clock{font-size:3.2vh;font-weight:900;font-variant-numeric:tabular-nums;color:#fff;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:1vh;padding:.4vh 1vw}

  /* Spalten (links etwas breiter: dort stehen Ergebnisse) */
  .body{position:absolute;left:1vw;right:1vw;top:10.6vh;bottom:.4vh;display:flex;gap:1.2vw}
  .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
  .col:first-child{flex-grow:1.14}
  .sec{font-size:2.1vh;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    height:3vh;line-height:3vh;padding-left:.4vw;display:flex;align-items:center;gap:.6vw;flex:0 0 auto}
  .sec .cnt{color:#fff;opacity:.55;letter-spacing:.05em}
  .sec.live{color:#ff8a8a}
  .rows{display:flex;flex-direction:column}
  /* 15 Zeilen je Spalte, alle gleich hoch; Namen groß, bei Bedarf zweizeilig */
  .row{height:5.5vh;flex:0 0 auto;display:grid;align-items:center;column-gap:.5vw;font-size:2.5vh;font-weight:700;
    border-bottom:1px solid var(--line);padding:0 .4vw;contain:layout paint}
  .row:nth-child(odd){background:rgba(255,255,255,.035)}
  .row.empty{color:var(--muted);font-weight:600;font-style:italic;grid-template-columns:1fr !important;font-size:2.1vh}

  /* links: laufend + beendet | rechts: angesetzt */
  .lrow{grid-template-columns:3.2vw 1fr 1fr 11.4vw 6.4vw}
  .rrow{grid-template-columns:1fr 1fr 7.2vw 3.4vw 4vw}

  .pl{display:flex;align-items:center;gap:.4vw;min-width:0;height:100%}
  .pl.p1{justify-content:flex-end;text-align:right}
  .pl.p2{justify-content:flex-start;text-align:left}
  /* Name: einzeilig, sonst Vorname / Nachname untereinander – nie „…“ */
  .nm{flex:0 1 auto;display:flex;flex-direction:column;justify-content:center;line-height:1.02;min-width:0;white-space:nowrap;overflow:hidden}
  .nm.two{font-size:2.1vh}
  .fl{display:inline-block;width:3vh;height:2vh;background-size:cover;background-position:center;
    border-radius:.25vh;box-shadow:0 0 0 1px rgba(255,255,255,.22);flex:0 0 auto}
  .win .nm{color:#fff;font-weight:900}
  .lose .nm{color:#b9c4d3;font-weight:600}
  .crt{font-weight:900;color:#8fd0ff;font-variant-numeric:tabular-nums;text-align:center;font-size:2.3vh;
    background:rgba(143,208,255,.1);border-radius:.5vh;line-height:3vh}
  .crt.on{background:var(--live);color:#fff}
  .cat{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:0;line-height:1.1;text-align:center}
  .cat span{display:block;max-width:100%;white-space:nowrap}
  .cat .c1{font-size:1.9vh;font-weight:900;color:#8fd0ff}
  .cat .c2{font-size:1.6vh;font-weight:700;color:#c9def5;opacity:.85}
  .nm.open{color:var(--muted);font-style:italic;font-weight:600}
  .tm{font-weight:900;font-variant-numeric:tabular-nums;text-align:right}
  /* Sätze: max. 3 nebeneinander, Satz 4/5 in Zeile 2 */
  .res{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;overflow:hidden;
    font-variant-numeric:tabular-nums;font-size:1.95vh;font-weight:800;color:#e8eef7;line-height:1.15;letter-spacing:-.01em}
  .res .rl{white-space:nowrap;text-align:center}
  .res .gm{margin:0 .35vw}
  .res .x{color:var(--yellow);font-weight:900;margin-left:.3vw}
  .ls{display:flex;align-items:center;justify-content:center;gap:.5vw;font-variant-numeric:tabular-nums}
  .ls .g{background:#1b1b1b;border:1px solid rgba(255,255,255,.18);border-radius:.4vh;padding:0 .5vw;font-weight:900}
  .ls .p{color:var(--yellow);font-weight:900;font-size:2.8vh;min-width:3.6vw;text-align:center}
  .ls .st{font-size:1.7vh;font-weight:900;letter-spacing:.08em;color:var(--muted)}
  .dot{width:.9vh;height:.9vh;border-radius:50%;background:var(--live);animation:bl 1.4s infinite;flex:0 0 auto}
  @keyframes bl{50%{opacity:.25}}
  .mover{position:fixed;left:.6vw;bottom:.3vh;z-index:5;font:700 1.3vh "Segoe UI",Arial,sans-serif;color:rgba(255,255,255,.35);letter-spacing:.04em;pointer-events:none}
  .livebg{background:linear-gradient(90deg,rgba(255,75,75,.16),rgba(255,75,75,.03)) !important}
  .vcount{position:fixed;right:.6vw;bottom:.3vh}
</style>
</head>
<body>
<div id="app">
  <div id="mover" class="mover"></div>
  <div id="bg"></div>
  <div class="hd">
    <img id="logo" class="hd-logo" alt="" style="display:none">
    <div id="tname" class="hd-name"></div>
    <div class="hd-title">Match Overview</div>
    <div id="clock" class="hd-clock">--:--</div>
  </div>
  <div class="body">
    <div class="col">
      <div class="sec live"><span class="dot"></span>Matches on court <span id="cLive" class="cnt"></span></div>
      <div id="live" class="rows"></div>
      <div class="sec">Finished matches <span id="cDone" class="cnt"></span></div>
      <div id="done" class="rows"></div>
    </div>
    <div class="col">
      <div class="sec">Scheduled matches <span id="cSched" class="cnt"></span></div>
      <div id="sched" class="rows"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="auth.js"></script>
<script>
// Match Overview: rechts angesetzte Spiele (Zeit -> Court), links laufende + beendete Spiele.
// Je Spalte max. 30 Zeilen; links teilen sich laufende und beendete Spiele die 30 Plätze.
// Versionsnummer der Match Overview – bei jedem Update hochzählen (unten links sichtbar)
const MO_VERSION='MO 2.0';
document.getElementById('mover').textContent=MO_VERSION;
const MAX=15;   // Zeilen je Spalte (links teilen sich laufende + beendete Spiele die Plätze, rechts max. 15 nächste Spiele)
const params=new URLSearchParams(location.search);
const VENUE=params.get('loc')||null;
let SET=null, ALL=[], CORDER=[];

function escS(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- Flaggen (wie stream.html) ----
function flagUrl(code, region){
  const rf=(typeof regionFlagUrl==='function' && regionFlagUrl(region,80))||'';
  if(rf) return rf;
  if(!code) return '';
  let c=String(code).toLowerCase().trim();
  if(!/^[a-z]{2}$/.test(c) && !['eng','sct','wls'].includes(c)){
    c=(typeof countryToISO==='function' && countryToISO(code))||'';
  }
  if(!c) return '';
  const map={eng:'gb-eng',sct:'gb-sct',wls:'gb-wls'};
  return `https://flagcdn.com/h80/${map[c]||c}.png`;
}
function flagSpan(code, region){ const u=flagUrl(code,region); return u?`<span class="fl" style="background-image:url('${u}')"></span>`:''; }

function stTime(raw){ if(!raw) return ''; const s=String(raw); const m=s.match(/(\d{1,2}:\d{2})\s*$/)||s.match(/(\d{1,2}:\d{2})/); return m?m[1]:''; }
function mno(m){ const s=String(m.match_no||'').match(/\d+/); return s?parseInt(s[0],10):999999; }
function inVenue(m){ return !VENUE || !m.venue_id || m.venue_id===VENUE; }
function courtRank(n){ const i=CORDER.indexOf(n); return i>=0?i:1000+(Number(n)||0); }
function courtLbl(n){ return n==null||n===''?'–':('C'+String(n).padStart(2,'0')); }
function catOf(m){ return m.event||m.draw||''; }
// Kategorie zweizeilig: oben Konkurrenz („Herren B“), unten Gruppe/Runde („Qualifikation“, „P17 -21“, „Round of 16“)
function catHtml(m){
  const parts=String(catOf(m)).split(' - ').map(x=>x.trim()).filter(Boolean);
  const main=parts[0]||'';
  let sub=parts.slice(1).filter(x=>x.toLowerCase()!==main.toLowerCase()).join(' - ');   // „Herren B - Herren B - P17 -21“ -> „P17 -21“
  if(!sub && m.round) sub=String(m.round);
  return `<div class="cat"><span class="c1">${escS(main)}</span>${sub?`<span class="c2">${escS(sub)}</span>`:''}</div>`;
}

// ---- Satzpause: 15s letzten Stand halten, dann 0:0 (wie liveState() in stream.html) ----
const BETW={};
function curPts(m){
  const s=m.state||{}; let p1=s.cur?s.cur.p1:0, p2=s.cur?s.cur.p2:0;
  if(s.status==='between'){
    const key=(s.games||[]).length;
    if(!BETW[m.id] || BETW[m.id].key!==key) BETW[m.id]={key, at:Date.now()};
    if(Date.now()-BETW[m.id].at>=15000){ p1=0; p2=0; }
  } else delete BETW[m.id];
  return {p1,p2};
}

// ---- Klassifizierung ----
function isFinished(m){ return m.status==='confirmed' || (m.status==='live' && m.state && m.state.status==='finished'); }
function finishTs(m){
  const s=m.state||{};
  return s.finishedAt || (m.updated_at?Date.parse(m.updated_at):0) || m.sort_ts || 0;
}
function winnerOf(m){
  const s=m.state||{};
  if(s.matchWinner) return s.matchWinner;
  if(m.winner) return Number(m.winner)||0;
  const t=(Store.rubberTally?Store.rubberTally(m):null); return t?t.winner:0;
}
function resultHtml(m){
  const s=m.state||{};
  const games=(s.games||[]).map(g=>`${g.p1}-${g.p2}`);
  let txt=games.join('  ');
  if(!txt && m.score_text) txt=String(m.score_text);
  if(!txt && typeof m.result==='string') txt=m.result;
  // Spielende aus court.html: state.ending / match.ending = 'retired' | 'conduct' (| 'walkover' aus Verwaltung/Import)
  const end=String(s.ending||m.ending||'').toLowerCase();
  const blob=[m.score_text, typeof m.result==='string'?m.result:''].join(' ');
  let tag='';
  if(/walk|^w\.?o/.test(end) || /\bw\.?\s?o\.?\b|walkover/i.test(blob)) tag='w.o.';
  else if(end==='retired' || /\bret/i.test(blob)) tag='ret.';
  else if(end==='conduct' || /\bdisq/i.test(blob)) tag='disq.';
  // max. 3 Sätze je Zeile, Satz 4/5 darunter; Kennzeichen (ret./w.o.) hinten an die letzte Zeile
  const parts = games.length ? games : (txt ? String(txt).trim().split(/\s+/) : []);
  const x = tag ? `<span class="x">${tag}</span>` : '';
  if(!parts.length) return x ? `<div class="rl">${x}</div>` : '';
  const line = arr => arr.map(g=>`<span class="gm">${escS(g)}</span>`).join('');
  return `<div class="rl">${line(parts.slice(0,3))}${parts.length<=3?x:''}</div>`
       + (parts.length>3 ? `<div class="rl">${line(parts.slice(3))}${x}</div>` : '');
}

// ---- Zeilen: statischer Teil (Namen/Flaggen/Kategorie) + dynamischer Teil (Spielstand/Ergebnis) ----
function nameHtml(n){ const t=String(n==null?'':n).trim(); return t?`<span class="nm" data-t="${escS(t)}">${escS(t)}</span>`:'<span class="nm open" data-t="offen">offen</span>'; }
function players(m, w){
  const c1=w===1?'win':(w===2?'lose':''), c2=w===2?'win':(w===1?'lose':'');
  return `<div class="pl p1 ${c1}">${nameHtml(m.player1_name)}${flagSpan(m.player1_country,m.player1_region)}</div>
    <div class="pl p2 ${c2}">${flagSpan(m.player2_country,m.player2_region)}${nameHtml(m.player2_name)}</div>`;
}
function liveScore(m){
  const s=m.state||{};
  if(!s.status || s.status==='warmup') return `<div class="ls"><span class="st">WARM-UP</span></div>`;
  const p=curPts(m);
  return `<div class="ls"><span class="g">${s.gamesWon1||0}</span><span class="p">${p.p1}:${p.p2}</span><span class="g">${s.gamesWon2||0}</span>${s.status==='between'?'<span class="st">PAUSE</span>':''}</div>`;
}
// Zeilentypen: key (Zeilen-ID), cls, stat (ändert sich selten -> Neuaufbau der Zeile), dyn (nur dieses Feld wird aktualisiert)
const KIND={
  live:{ cls:'row lrow livebg',
    stat:m=>`<div class="crt on">${courtLbl(m.court_id)}</div>${players(m,0)}<div class="dyn"></div>${catHtml(m)}`,
    dyn:liveScore },
  done:{ cls:'row lrow',
    stat:m=>`<div class="crt">${courtLbl(m.court_id||m.court_no)}</div>${players(m,winnerOf(m))}<div class="res dyn"></div>${catHtml(m)}`,
    dyn:resultHtml },
  sched:{ cls:'row rrow',
    stat:m=>`${players(m,0)}${catHtml(m)}<div class="crt">${courtLbl(m.court_no)}</div><div class="tm">${escS(stTime(m.scheduled_time))||'--:--'}</div>`,
    dyn:null },
};
function splitName(t){
  // Platzhalter sinnvoll teilen („Loser 1-2 / Do 29.10. …“, „A. Askar or / S. Ahmed“), Namen möglichst ausgewogen
  for(const sep of [' - ',' or ',' oder ',' / ']){ const k=t.indexOf(sep); if(k>0) return [t.slice(0,k)+(sep.trim()==='-'?'':' '+sep.trim()), t.slice(k+sep.length)]; }
  const w=t.split(/\s+/); if(w.length<2) return [t,''];
  let best=null; for(let k=1;k<w.length;k++){ const a=w.slice(0,k).join(' '), b=w.slice(k).join(' '), sc=Math.max(a.length,b.length); if(!best||sc<best[0]) best=[sc,a,b]; }
  return [best[1],best[2]];
}
function shrinkTo(el,minVh){ let f=parseFloat(getComputedStyle(el).fontSize); const min=window.innerHeight*minVh/100;
  while(el.scrollWidth>el.clientWidth+.5 && f>min){ f-=.5; el.style.fontSize=f+'px'; } }
function fitName(el){
  const t=el.dataset.t||el.textContent;
  el.classList.remove('two'); el.style.fontSize=''; el.textContent=t;
  if(el.scrollWidth<=el.clientWidth+.5) return;                          // passt einzeilig
  const [a,b]=splitName(t);
  if(b){ el.classList.add('two'); el.innerHTML=`<span>${escS(a)}</span><span>${escS(b)}</span>`; }
  shrinkTo(el,1.6);                                                     // nur notfalls verkleinern, nie „…“
}
function fitRow(row){
  row.querySelectorAll('.nm').forEach(fitName);
  row.querySelectorAll('.cat span').forEach(el=>{ el.style.fontSize=''; shrinkTo(el,1.2); });
}
function fitRes(el){ el.style.fontSize=''; shrinkTo(el,1.4); }
// Liste abgleichen: vorhandene Zeilen behalten, nur Änderungen schreiben (kein Neuaufbau -> kein Zucken)
function syncRows(host, items, kind, emptyText){
  const K=KIND[kind];
  host._rows=host._rows||new Map();
  const keep=new Set();
  let prev=null;
  items.forEach(m=>{
    keep.add(m.id);
    let row=host._rows.get(m.id), fresh=false;
    const stat=K.stat(m);
    if(!row){ row=document.createElement('div'); row.className=K.cls; host._rows.set(m.id,row); fresh=true; }
    // an die richtige Position (nur verschieben, wenn nötig)
    const want=prev?prev.nextSibling:host.firstChild;
    if(want!==row) host.insertBefore(row, want);
    if(fresh || row._stat!==stat){ row.innerHTML=stat; row._stat=stat; row._dyn=null; fitRow(row); }
    if(K.dyn){ const d=K.dyn(m); if(row._dyn!==d){ const c=row.querySelector('.dyn'); if(c){ c.innerHTML=d; if(kind==='done') fitRes(c); } row._dyn=d; } }
    prev=row;
  });
  host._rows.forEach((row,id)=>{ if(!keep.has(id)){ row.remove(); host._rows.delete(id); } });
  // Leer-Hinweis
  let em=host.querySelector(':scope > .empty');
  if(!items.length && emptyText){ if(!em){ em=document.createElement('div'); em.className='row empty'; host.appendChild(em); } if(em.textContent!==emptyText) em.textContent=emptyText; }
  else if(em) em.remove();
}
function setText(id,t){ const e=document.getElementById(id); if(e && e.textContent!==t) e.textContent=t; }

// ---- Render ----
function render(){
  const ms=ALL.filter(inVenue);
  const live=ms.filter(m=>m.status==='live' && !isFinished(m))
    .sort((a,b)=>courtRank(a.court_id)-courtRank(b.court_id));
  const done=ms.filter(isFinished).sort((a,b)=>finishTs(b)-finishTs(a));
  const sched=ms.filter(m=>m.status==='scheduled')
    .sort((a,b)=>(a.sort_ts||0)-(b.sort_ts||0) || courtRank(a.court_no)-courtRank(b.court_no) || mno(a)-mno(b));

  const liveVis=live.slice(0,MAX);
  const doneVis=done.slice(0,Math.max(0,MAX-liveVis.length));
  const schedVis=sched.slice(0,MAX);

  syncRows(document.getElementById('live'), liveVis, 'live', 'Aktuell kein Spiel auf dem Court');
  syncRows(document.getElementById('done'), doneVis, 'done', liveVis.length<MAX?'Noch keine beendeten Spiele':'');
  syncRows(document.getElementById('sched'), schedVis, 'sched', 'Keine angesetzten Spiele');
  setText('cLive', live.length?`(${live.length})`:'');
  setText('cDone', done.length?`(${done.length})`:'');
  setText('cSched', sched.length?(sched.length>MAX?`(${sched.length}) · nächste ${MAX}`:`(${sched.length})`):'');
}
// Neu einpassen (nach Größenänderung / Schriftladen) – Zeilen bleiben bestehen
function refitAll(){ document.querySelectorAll('.rows .row:not(.empty)').forEach(fitRow); document.querySelectorAll('.res.dyn').forEach(fitRes); }

// Turniername immer passend: erst einzeilig verkleinern (4,6vh -> 3vh),
// reicht das nicht, zweizeilig umbrechen und wieder so groß wie möglich (max. 3,8vh, min. 1,9vh).
// Browser messen auf ganze Pixel gerundet -> am Ende 2 % Luft, damit sicher keine „…“ entstehen.
function fitTitle(){
  const el=document.getElementById('tname'); if(!el) return;
  const vh=window.innerHeight/100;
  const fitW=()=>el.scrollWidth<=el.clientWidth;
  const fitH=()=>el.scrollHeight<=el.clientHeight+1;
  const best=(lo,hi,ok)=>{ el.style.fontSize=hi+'px'; if(ok()) return hi;
    for(let i=0;i<14;i++){ const mid=(lo+hi)/2; el.style.fontSize=mid+'px'; if(ok()) lo=mid; else hi=mid; }
    return lo; };
  el.classList.remove('two');
  let f=best(3*vh, 4.6*vh, fitW);
  el.style.fontSize=f+'px';
  if(fitW()){ if(el.scrollWidth>=el.clientWidth-1) el.style.fontSize=(f*0.98)+'px'; return; }   // knapp -> etwas Luft
  el.classList.add('two');
  f=best(1.9*vh, 3.8*vh, ()=>fitH() && fitW());
  el.style.fontSize=(f*0.98)+'px';
}
function titleOverflows(){ const el=document.getElementById('tname'); return !!el && (el.scrollWidth>el.clientWidth || el.scrollHeight>el.clientHeight+1); }
let TNAME='';   // Name des aktiven Turniers (Fallback, wenn kein Anzeigename gesetzt ist)
function paintHead(){
  const sn=String((SET&&SET.tournamentName)||'').trim();
  const name=(sn && sn!=='Squash Turnier') ? sn : (TNAME||sn);   // kein/Standard-Anzeigename -> echter Turniername
  document.getElementById('tname').textContent=name;
  requestAnimationFrame(fitTitle);
  document.title='Match Overview'+(name?(' – '+name):'');
  const lg=document.getElementById('logo');
  if(SET&&SET.logoUrl){ lg.src=SET.logoUrl; lg.style.display='block'; } else lg.style.display='none';
  const bg=document.getElementById('bg');
  if(SET&&SET.backgroundUrl){ bg.style.backgroundImage=`url('${SET.backgroundUrl}')`; bg.style.opacity=Math.min(1,Math.max(0,Number(SET.bgOpacity!=null?SET.bgOpacity:0.5)))*0.35; }
  else bg.style.opacity=0;
}
function clock(){ const d=new Date(); document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

// ---- Daten / Realtime ----
async function loadCourtOrder(){
  try{ CORDER=await Store.usedCourtNumbers(null, VENUE); }catch(e){ CORDER=[]; }
  if(!CORDER.length && SET && Array.isArray(SET.courts)) CORDER=SET.courts.map(Number);
}
async function loadTourName(){
  try{ const tid=await Store.ensureActiveTournament(); if(!tid){ TNAME=''; return; }
    const ts=await Store.listTournaments(); const t=(ts||[]).find(x=>x.id===tid); TNAME=t?String(t.name||''):''; }
  catch(e){ TNAME=''; }
}
async function refreshSettings(){ try{ SET=await Store.getSettings(); }catch(e){ SET=SET||{}; } await loadTourName(); paintHead(); await loadCourtOrder(); render(); }
let _loading=false, _again=false;
async function load(){
  if(_loading){ _again=true; return; }
  _loading=true;
  try{ ALL=LiveFeed.apply(await Store.listMatches()); render(); }catch(e){ console.warn('[matchoverview] load', e); }
  _loading=false;
  if(_again){ _again=false; load(); }
}
document.addEventListener('keydown',e=>{ if(e.key==='f'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen&&document.exitFullscreen(); } });
window.addEventListener('resize',()=>requestAnimationFrame(()=>{ refitAll(); fitTitle(); }));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ fitTitle(); refitAll(); });   // nach dem Laden der Schrift neu messen
// Logo lädt oft erst nach dem Namen -> danach neu anpassen; zusätzlich bei jeder Größenänderung des Namensfelds
document.getElementById('logo').addEventListener('load',()=>requestAnimationFrame(fitTitle));
setInterval(()=>{ const el=document.getElementById('tname'); if(titleOverflows()) fitTitle(); },2000);   // Sicherheitsnetz
if(window.ResizeObserver){ let _fw=0;
  new ResizeObserver(es=>{ const w=Math.round(es[0].contentRect.width); if(w!==_fw){ _fw=w; requestAnimationFrame(fitTitle); } })
    .observe(document.getElementById('tname')); }

// ---- Öffentlicher Modus (TV/OBS/Handy ohne Login) ----
// Ohne Supabase-Sitzung, aber mit Turnier-Token (?t=) kommen alle Daten über die
// RPC-Funktion overview_public (security definer, nur dieses Turnier).
// Realtime greift für anonyme Nutzer nicht (RLS) -> Polling.
const TID=params.get('t')||null;
const PUBLIC_POLL_MS=3000;
let _pubBusy=false;
async function pollPublic(){
  if(_pubBusy) return; _pubBusy=true;
  try{
    const d=(await rpcPublic('overview_public', { p_tid: TID, p_venue: VENUE }))||{};
    SET=Object.assign(Store._defaults(), d.app||{}, d.tour||{});
    TNAME=String(d.name||'');
    CORDER=(d.courts||[]).map(c=>c.court_no);
    if(!CORDER.length && Array.isArray(SET.courts)) CORDER=SET.courts.map(Number);
    ALL=LiveFeed.apply((d.matches||[]).slice().sort((a,b)=>(a.sort_ts||0)-(b.sort_ts||0)));
    paintHead(); render();
  }catch(e){ console.warn('[matchoverview] öffentlicher Abruf fehlgeschlagen:', e && (e.message||e)); }
  finally{ _pubBusy=false; }
}
// ---- Live-Feed: Punkte direkt von den Tablets (Broadcast), Datenbank als Absicherung ----
let _liveRaf=0;
function onLive(p){
  const next=LiveFeed.patch(ALL,p); if(!next) return;
  ALL=next;
  if(!_liveRaf) _liveRaf=requestAnimationFrame(()=>{ _liveRaf=0; render(); });   // mehrere Courts gleichzeitig -> einmal zeichnen
}
async function startLive(){ let tid=TID; if(!tid){ try{ tid=await Store.ensureActiveTournament(); }catch(e){} } LiveFeed.start(tid, onLive); }
function startAuthed(){
  Auth.guard('view').then(()=>{
    startLive();
    Store.subscribeAll(load);
    Store.subscribeSettings(refreshSettings);
    refreshSettings();
    load();
  });
  setInterval(load,60000); // Sicherheitsnetz, falls Realtime-Events verloren gehen
}

clock(); setInterval(clock,10000);
(async()=>{
  const sb=Store.client();
  let sess=null;
  if(sb){ try{ sess=(await sb.auth.getSession()).data.session; }catch(e){} }
  if(Store.mode!=='supabase' || !TID){ startAuthed(); return; }   // Testmodus / kein Token -> wie bisher (mit Login)
  // Mit Token IMMER öffentlich laden – unabhängig von einer (evtl. alten/fremden) Anmeldung im Browser
  if(sess && sb){ try{ Store.subscribeAll(pollPublic); }catch(e){} }   // angemeldet: Realtime als Sofort-Auslöser
  startLive();                                                          // Punkte direkt von den Tablets
  await pollPublic();
  setInterval(pollPublic, PUBLIC_POLL_MS);
})();
setInterval(()=>{ if(ALL.some(m=>m.status==='live' && m.state && m.state.status==='between')) render(); },1000); // 15s-Halt in der Satzpause
</script>
