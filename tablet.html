<!DOCTYPE html>
<html lang="de">
<head>
<script src="i18n.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Squash Schiedsrichter</title>
<style>
  :root{--bg:#0d1117;--panel:#161c26;--line:#243247;--ink:#eef3fb;--muted:#8aa0bf;--blue:#2f6bff;--green:#7CFF9B;--gold:#ffd54a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none;
    font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  .app{height:100vh;display:flex;flex-direction:column}
  header{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0f1724,#0d1117)}
  header img.logo{height:52px;max-width:200px;object-fit:contain}
  header h1{font-size:clamp(18px,3vh,26px);margin:0;font-weight:900}
  header .sp{flex:1}
  .badge{color:var(--muted);font-size:14px}
  .btn{background:#1a2434;color:var(--ink);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}
  .btn.green{background:var(--green);color:#06210f;border:0}
  .btn:active{transform:scale(.98)}
  main{flex:1 1 auto;overflow:auto;padding:22px;-webkit-overflow-scrolling:touch}
  .step-title{font-size:clamp(20px,3.4vh,30px);font-weight:900;margin:0 0 4px}
  .step-sub{color:var(--muted);margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;cursor:pointer;
    display:flex;flex-direction:column;gap:6px;min-height:96px;justify-content:center}
  .tile:active{transform:scale(.98);border-color:var(--blue)}
  .tile .t{font-size:clamp(20px,3vh,26px);font-weight:900}
  .tile .s{color:var(--muted);font-size:15px}
  .venuehead{grid-column:1/-1;color:#8fd0ff;font-weight:900;font-size:18px;margin:10px 2px 0}
  .courttile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;gap:6px}
  .courttile:active{transform:scale(.97);border-color:var(--blue)}
  .courttile .cn{font-size:clamp(30px,6vh,54px);font-weight:900;line-height:1}
  .courttile.center{border-color:var(--gold)}.courttile.semi{border-color:#8fd0ff}
  .cfn{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
  .cfn.center{background:#3a2f0c;color:var(--gold)}.cfn.semi{background:#0e2036;color:#8fd0ff}
  .empty{color:var(--muted);font-size:18px;padding:40px 0;text-align:center}
  select.lang{background:#1a2434;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit}
  .netstat{font-size:14px;font-weight:800;padding:5px 11px;border-radius:999px;white-space:nowrap;background:#0d1b12;border:1px solid #1f6b46;color:#7CFF9B}
  .netstat.off{background:#2a0f12;border-color:#7a2a2f;color:#ff6b6b}
  .ver{font-size:12px;font-weight:800;color:#6b7a90;padding:6px 8px}
  .adcorner{position:fixed;bottom:12px;display:flex;gap:10px;z-index:6;align-items:flex-end}
  .adcorner.adL{left:16px}
  .adcorner.adR{right:16px}
  .adcorner img{height:52px;max-width:150px;object-fit:contain;background:#fff;border-radius:10px;padding:5px 8px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .resumebar{background:linear-gradient(90deg,#10243a,#0f1724);border:1px solid #2f6bff;border-radius:16px;
    padding:16px 18px;margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .resumebar .info{flex:1;min-width:200px}
  .resumebar .info b{font-size:clamp(18px,2.6vh,22px)}
  .resumebar .sub{color:var(--muted);font-size:14px;margin-top:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <img id="logo" class="logo" alt="" style="display:none">
    <h1>🎾 Schiedsrichter</h1>
    <span class="badge" id="userBadge"></span>
    <span class="ver">v26</span>
    <span id="netStatus" class="netstat on">🟢 Online</span>
    <span class="sp"></span>
    <select class="lang" data-lang-select onchange="I18N.set(this.value)" title="Sprache / Language">
      <option value="de">🇩🇪 DE</option><option value="en">🇬🇧 EN</option></select>
    <button class="btn" onclick="Auth.signOut&&Auth.signOut()">Abmelden</button>
  </header>
  <main>
    <div id="adL" class="adcorner adL"></div>
    <div id="adR" class="adcorner adR"></div>
    <div id="resumeBar"></div>
    <div id="step1">
      <h2 class="step-title">1 · Turnier auswählen</h2>
      <p class="step-sub">Wähle das Turnier für dieses Tablet.</p>
      <div class="grid" id="tourGrid"></div>
    </div>
    <div id="step2" style="display:none">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <button class="btn" onclick="showStep(1)">‹ Zurück</button>
        <h2 class="step-title" style="margin:0">2 · Court auswählen</h2>
      </div>
      <p class="step-sub" id="step2sub"></p>
      <div class="grid" id="courtGrid"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="ranking.js"></script>
<script src="auth.js"></script>
<script>
let TID=null, TNAME='';
const LASTKEY='squash_tablet_last';
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function showStep(n){ document.getElementById('step1').style.display=n===1?'':'none'; document.getElementById('step2').style.display=n===2?'':'none'; }
function toggleFull(){ const el=document.documentElement;
  if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
  else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); } }
function setNet(b){ const el=document.getElementById('netStatus'); if(el){ el.textContent=b?'🟢 Online':'🔴 Offline'; el.className='netstat '+(b?'on':'off'); } }
function safeSet(key, val){
  try{ localStorage.setItem(key, val); return true; }
  catch(e){   // Speicher voll -> unwichtige Caches entfernen und einmal erneut versuchen
    try{ Object.keys(localStorage).forEach(k=>{ if(k==='squash_tablet_tours'||k.indexOf('squash_tablet_courts_')===0) localStorage.removeItem(k); }); }catch(_){}
    try{ localStorage.setItem(key, val); return true; }catch(_){ return false; }
  }
}

function saveLast(o){ try{ localStorage.setItem(LASTKEY, JSON.stringify(o)); }catch(e){} }
function loadLast(){ try{ return JSON.parse(localStorage.getItem(LASTKEY)||'null'); }catch(e){ return null; } }
function renderResume(){
  const bar=document.getElementById('resumeBar'); const last=loadLast();
  if(!bar) return;
  if(!last){ bar.innerHTML=''; return; }
  const loc=last.venueName?(' · '+esc(last.venueName)):'';
  bar.className='resumebar';
  bar.innerHTML=`<div class="info"><b>Fortsetzen: Court ${esc(String(last.court))}</b>
      <div class="sub">${esc(last.tname||'')}${loc}</div></div>
    <button class="btn green" onclick="resumeLast()" style="font-size:18px;padding:14px 22px">▶ Zum Court</button>`;
}
function resumeLast(){ const last=loadLast(); if(!last) return;
  const p=new URLSearchParams(); p.set('court',last.court); if(last.tid)p.set('t',last.tid); if(last.venue)p.set('loc',last.venue);
  location.href='court.html?'+p.toString();
}

async function renderHeader(){
  try{ const s=await Store.getSettings(); const l=document.getElementById('logo');
    if(s&&s.logoUrl){ l.src=s.logoUrl; l.style.display='block'; }
    renderAds(s); }catch(e){}
  if(typeof Auth!=='undefined' && Auth.user && Auth.user()){
    document.getElementById('userBadge').textContent='👤 '+(Auth.user().email||'');
  }
}
function renderAds(s){
  const L=document.getElementById('adL'), R=document.getElementById('adR');
  const left=(s&&Array.isArray(s.adLeft))?s.adLeft:[];
  const right=(s&&Array.isArray(s.adRight))?s.adRight:[];
  const img=u=>`<img src="${u}" alt="" onerror="this.style.display='none'">`;
  if(L) L.innerHTML=left.slice(0,2).map(img).join('');
  if(R) R.innerHTML=right.slice(0,2).map(img).join('');
}
async function loadTournaments(){
  const g=document.getElementById('tourGrid');
  let ts=null, err=null;
  try{ ts=await Store.listTournaments(); setNet(true); }
  catch(e){ err=e; }
  if(ts){ safeSet('squash_tablet_tours', JSON.stringify(ts)); }          // Zwischenspeichern (nicht kritisch)
  if(err){                                                                 // echter Ladefehler
    try{ ts=JSON.parse(localStorage.getItem('squash_tablet_tours')||'null'); }catch(_){ ts=null; }
    if(!ts){
      const msg=(err&&err.message)?err.message:String(err);
      const offline = (navigator.onLine===false) || /failed to fetch|networkerror|load failed|fetch/i.test(msg);
      setNet(!offline);
      g.innerHTML = '<div class="empty">'+(offline
        ? 'Offline. Nutze oben „Fortsetzen", um zum zuletzt genutzten Court zu gelangen.'
        : ('Turniere konnten nicht geladen werden.<br><br><b style="color:#ff8a8a">'+esc(msg)+'</b>'))+'</div>';
      return;
    }
  }
  setNet(true);
  if(!ts || !ts.length){
    g.innerHTML='<div class="empty">Keine Turniere für dieses Konto. Bitte in der Verwaltung unter „Mitglieder & Rollen“ diesem Konto ein Turnier zuweisen.</div>';
    return;
  }
  g.innerHTML=ts.map(t=>`<div class="tile" onclick="chooseTournament('${t.id}','${esc(t.name)}')">
    <div class="t">🏆 ${esc(t.name)}</div><div class="s">Turnier wählen</div></div>`).join('');
}
async function chooseTournament(id,name){
  TID=id; TNAME=name;
  try{ await Store.setActiveTournament(id); }catch(e){}
  document.getElementById('step2sub').textContent='Turnier: '+name;
  showStep(2); await loadCourts();
}
async function loadCourts(){
  const g=document.getElementById('courtGrid'); g.innerHTML='<div class="empty">Lade…</div>';
  let venues=[], courts=[], ok=false;
  try{ venues=await Store.getTournamentVenues(TID); courts=await Store.getTournamentCourts(TID); ok=true; setNet(true);
    safeSet('squash_tablet_courts_'+TID, JSON.stringify({venues,courts})); }
  catch(e){ setNet(false); try{ const c=JSON.parse(localStorage.getItem('squash_tablet_courts_'+TID)||'null'); if(c){ venues=c.venues||[]; courts=c.courts||[]; ok=true; } }catch(_){} }
  window.__venueName={}; venues.forEach(v=>window.__venueName[v.venue_id]=v.name);
  if(ok && courts.length){
    const order = venues.length ? venues : [...new Set(courts.map(c=>c.venue_id))].map(id=>({venue_id:id,name:''}));
    let html='';
    order.forEach(v=>{
      const cs=courts.filter(c=>c.venue_id===v.venue_id).slice().sort((a,b)=>(a.sort-b.sort)||(a.court_no-b.court_no));
      if(!cs.length) return;
      if(order.length>1 || v.name) html+=`<div class="venuehead">🏟 ${esc(v.name||'Location')}</div>`;
      html+=cs.map(c=>courtTile(c.court_no, v.venue_id, c.function)).join('');
    });
    g.innerHTML=html || '<div class="empty">Keine Courts zugeordnet.</div>';
    return;
  }
  // Fallback: einfache Court-Liste aus den Einstellungen (online)
  let list=[]; try{ const s=await Store.getSettings(); list=Array.isArray(s.courts)?s.courts:[]; }catch(e){}
  if(!list.length){ g.innerHTML = ok ? '<div class="empty">Für dieses Turnier sind keine Courts festgelegt (Einstellungen → Anlagen & Courts).</div>'
                                      : '<div class="empty">Offline und keine gespeicherten Courts für dieses Turnier.</div>'; return; }
  g.innerHTML=list.map(n=>courtTile(n,null,'normal')).join('');
}
function courtTile(n, venueId, fn){
  const cls='courttile'+(fn==='center'?' center':fn==='semi'?' semi':'');
  const tag=fn==='center'?'<span class="cfn center">Center · Finale</span>':fn==='semi'?'<span class="cfn semi">Halbfinale</span>':'';
  return `<div class="${cls}" onclick="openCourt(${n},'${venueId||''}')"><div class="cn">${n}</div><div class="s">Court</div>${tag}</div>`;
}
function openCourt(n, venueId){
  const venueName=(window.__venueName&&venueId)?window.__venueName[venueId]:'';
  saveLast({ tid:TID, tname:TNAME, court:n, venue:venueId||'', venueName:venueName||'' });
  const p=new URLSearchParams(); p.set('court', n); if(TID) p.set('t', TID); if(venueId) p.set('loc', venueId);
  location.href='court.html?'+p.toString();
}

// Service-Worker + Kiosk-Gesten
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
document.addEventListener('contextmenu', e=>e.preventDefault());
let _lt=0; document.addEventListener('touchend', e=>{ const t=Date.now(); if(t-_lt<300){ e.preventDefault(); } _lt=t; }, {passive:false});
window.addEventListener('online', ()=>{ setNet(true); loadTournaments(); });
window.addEventListener('offline', ()=>{ setNet(false); });

// Start: Resume-Banner immer sofort (auch offline). Auswahl nur online über Login.
renderResume();
if(navigator.onLine===false){
  setNet(false);
  const g=document.getElementById('tourGrid');
  if(g) g.innerHTML='<div class="empty">Offline. Nutze oben „Fortsetzen", um zum zuletzt genutzten Court zu gelangen. Für die Turnier-/Court-Auswahl bitte online gehen.</div>';
} else {
  Auth.guard('view').then(()=>{ setNet(true); renderHeader(); renderResume(); loadTournaments(); })
    .catch(()=>{ setNet(false); });
}
</script>
</body>
</html>
